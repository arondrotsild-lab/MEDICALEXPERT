<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сайт временно недоступен</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#06171b">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#06171b;--pearl:#f1ebe1;--mist:#9db1af;--gold:#d6b98a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--pearl);font-family:Georgia,"Times New Roman",serif;display:grid;place-items:center;text-align:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
main{display:grid;gap:18px;justify-items:center;max-width:520px}
.line{width:40px;height:1px;background:var(--gold)}
h1{font-weight:400;font-size:clamp(26px,5vw,38px);line-height:1.2;margin:0}
p{margin:0;color:var(--mist);font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.6}
</style>
</head>
<body>
<main>
  <div class="line"></div>
  <h1>Сайт временно недоступен</h1>
  <p>This website is temporarily unavailable.</p>
  <div class="line"></div>
</main>
</body>
</html>
